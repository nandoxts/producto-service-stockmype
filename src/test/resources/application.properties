# Las pruebas de la capa de datos corren solas: sin Config Server ni Eureka
spring.application.name=producto-service-stockmype
spring.cloud.config.enabled=false
eureka.client.enabled=false

spring.datasource.url=jdbc:mysql://localhost:3306/stockmype_productos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
